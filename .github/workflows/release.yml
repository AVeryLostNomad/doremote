name: Release

# Push a tag like v0.1.0 to build the connector for macOS and Windows and publish a GitHub
# release with both attached. Run manually (workflow_dispatch) to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Build doremote.app (universal)
        run: VERSION="${GITHUB_REF_NAME#v}" packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/doremote-macos.zip
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Build doremote.exe (amd64, arm64)
        run: VERSION="${GITHUB_REF_NAME#v}" packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/doremote-windows-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **macOS** — download `doremote-macos.zip`, unzip, move `doremote.app` to Applications, then right-click → Open the first time (the app is not notarized). Grant Screen Recording and Accessibility when asked.

            **Windows** — download `doremote-windows-amd64.exe` (or `-arm64` for ARM PCs) and run it. If SmartScreen warns, choose More info → Run anyway. Use the tray menu's "Install the virtual display driver…" the first time.
          files: |
            dist/doremote-macos.zip
            dist/doremote-windows-amd64.exe
            dist/doremote-windows-arm64.exe
