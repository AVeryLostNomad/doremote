<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8EC5FF"/>
      <stop offset="0.55" stop-color="#7B8CFF"/>
      <stop offset="1" stop-color="#B07BFF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F4A"/>
      <stop offset="1" stop-color="#1B1E33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A1F6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS-style squircle tile with margin -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="412" rx="190" fill="#fff" opacity="0.10"/>
  <!-- signal waves -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.95">
    <path d="M430 262 a116 116 0 0 1 164 0" stroke-width="34"/>
    <path d="M380 212 a186 186 0 0 1 264 0" stroke-width="34" opacity="0.7"/>
  </g>
  <circle cx="512" cy="318" r="24" fill="#FFFFFF"/>
  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="232" y="372" width="560" height="390" rx="78" fill="#FFFFFF"/>
    <rect x="452" y="752" width="120" height="58" rx="14" fill="#FFFFFF"/>
    <rect x="372" y="796" width="280" height="44" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="270" y="410" width="484" height="314" rx="50" fill="url(#screen)"/>
  <!-- face -->
  <ellipse cx="420" cy="540" rx="30" ry="36" fill="#FFFFFF"/>
  <ellipse cx="604" cy="540" rx="30" ry="36" fill="#FFFFFF"/>
  <circle cx="430" cy="528" r="10" fill="#1B1E33"/>
  <circle cx="614" cy="528" r="10" fill="#1B1E33"/>
  <ellipse cx="360" cy="612" rx="34" ry="20" fill="#FF8FB1" opacity="0.85"/>
  <ellipse cx="664" cy="612" rx="34" ry="20" fill="#FF8FB1" opacity="0.85"/>
  <path d="M470 610 q42 40 84 0" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
</svg>
